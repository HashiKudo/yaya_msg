name: Build Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      replace_mac_release_tag:
        description: Existing release tag whose macOS asset should be replaced
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact_name: yaya-msg-windows
            build_command: npm run dist -- --win zip --publish never
            artifact_path: |
              dist/*.zip
          - os: macos-latest
            label: macOS
            artifact_name: yaya-msg-macos
            build_command: npm run dist -- --mac zip --publish never && for f in dist/*.zip; do mv "$f" "${f%.zip}-mac.zip"; done
            artifact_path: |
              dist/*-mac.zip
          - os: ubuntu-latest
            label: Linux
            artifact_name: yaya-msg-linux
            build_command: npm run dist -- --linux tar.gz --publish never && for f in dist/*.tar.gz; do mv "$f" "${f%.tar.gz}-linux.tar.gz"; done
            artifact_path: |
              dist/*-linux.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: ${{ matrix.build_command }}

      - name: Verify bundled FFmpeg in macOS archive
        if: matrix.label == 'macOS'
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          archives = glob.glob('dist/*-mac.zip')
          if len(archives) != 1:
              raise SystemExit(f'Expected one macOS archive, found: {archives}')

          with zipfile.ZipFile(archives[0]) as archive:
              matches = [
                  entry for entry in archive.infolist()
                  if entry.filename.endswith('/Contents/Resources/ffmpeg')
              ]

          if len(matches) != 1:
              raise SystemExit(f'Expected one bundled FFmpeg entry, found: {len(matches)}')

          mode = matches[0].external_attr >> 16
          if mode & 0o111 == 0:
              raise SystemExit(f'Bundled FFmpeg is not executable: mode={mode:o}')

          print(f'Verified bundled FFmpeg: mode={mode:o}, size={matches[0].file_size}')
          PY

      - name: Verify bundled FFmpeg in Linux archive
        if: matrix.label == 'Linux'
        run: |
          python3 - <<'PY'
          import glob
          import tarfile

          archives = glob.glob('dist/*-linux.tar.gz')
          if len(archives) != 1:
              raise SystemExit(f'Expected one Linux archive, found: {archives}')

          with tarfile.open(archives[0], 'r:gz') as archive:
              matches = [
                  entry for entry in archive.getmembers()
                  if entry.isfile() and entry.name.endswith('/resources/ffmpeg')
              ]

          if len(matches) != 1:
              raise SystemExit(f'Expected one bundled FFmpeg entry, found: {len(matches)}')

          mode = matches[0].mode
          if mode & 0o111 == 0:
              raise SystemExit(f'Bundled FFmpeg is not executable: mode={mode:o}')

          with tarfile.open(archives[0], 'r:gz') as archive:
              top_level = {
                  entry.name.split('/', 1)[1]: entry
                  for entry in archive.getmembers()
                  if '/' in entry.name and '/' not in entry.name.split('/', 1)[1]
              }

          required_files = {
              'icon.png': False,
              '安装到应用菜单.sh': True,
              '卸载.sh': True,
          }
          for name, must_be_executable in required_files.items():
              entry = top_level.get(name)
              if not entry or not entry.isfile():
                  raise SystemExit(f'Missing Linux desktop integration file: {name}')
              if must_be_executable and entry.mode & 0o111 == 0:
                  raise SystemExit(f'Linux desktop integration file is not executable: {name}, mode={entry.mode:o}')

          print(f'Verified bundled FFmpeg: mode={mode:o}, size={matches[0].size}')
          print('Verified Linux desktop integration files')
          PY

      - name: Replace macOS asset in existing release
        if: matrix.label == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.replace_mac_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 dist/*-mac.zip
          gh release upload "${{ inputs.replace_mac_release_tag }}" dist/*-mac.zip --clobber

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Remove old release assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
